[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globex-agent"
version = "0.1.0"
description = "A full-stack multi-agent application scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langgraph>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
search = [
  "faiss-cpu>=1.15,<2.0",
  "FlagEmbedding>=1.3,<2.0",
  # Windows 检索环境固定使用支持 RTX 50 系显卡的 CUDA 13.0 wheel。
  "torch==2.11.0",
  # FlagEmbedding 1.4.0 的 encoder-only reranker 仍调用 v5 已移除的接口。
  "transformers>=4.44.2,<5.0",
]
rag = [
  "opensearch-py>=3.0,<4.0",
]
platform = [
  "langfuse>=3.0,<5.0",
  "redis>=5.0,<7.0",
  "langgraph-checkpoint-sqlite>=2.0,<4.0",
  "tavily-python>=0.7,<1.0",
]
dev = [
  "jsonschema>=4.23,<5.0",
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

