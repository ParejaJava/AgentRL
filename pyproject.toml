[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globex-agent"
version = "0.1.0"
description = "A full-stack multi-agent application scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langgraph>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
search = [
  "faiss-cpu>=1.15,<2.0",
  "FlagEmbedding>=1.3,<2.0",
]
rag = [
  "opensearch-py>=3.0,<4.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

