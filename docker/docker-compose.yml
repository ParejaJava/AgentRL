services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: globex-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CHECKPOINT_BACKEND: sqlite
      CHECKPOINT_DATABASE_PATH: /app/data/sessions/langgraph-checkpoints.db
      PREFERENCE_DATABASE_PATH: /app/data/sessions/preferences.db
      ORDER_DATABASE_PATH: /app/data/orders/orders.db
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file:
      - ../.env
    environment:
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CHECKPOINT_BACKEND: sqlite
      CHECKPOINT_DATABASE_PATH: /app/data/sessions/langgraph-checkpoints.db
      PREFERENCE_DATABASE_PATH: /app/data/sessions/preferences.db
      ORDER_DATABASE_PATH: /app/data/orders/orders.db
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

volumes:
  redis-data:
  opensearch-data:

